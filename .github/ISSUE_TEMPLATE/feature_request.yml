name: 功能建议
description: 想要某个新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: 你希望加什么
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要它 / 现在哪里不方便
    validations:
      required: false
